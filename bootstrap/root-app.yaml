# Кореневий Application (App of Apps).
# Це єдиний об'єкт, який застосовується вручну:
#   kubectl apply -n argocd -f bootstrap/root-app.yaml
# Далі Argo CD сам бере з каталогу argocd-apps/ усі дочірні Application.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Brenkach/farm-association-gitops.git
    targetRevision: main
    path: argocd-apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
