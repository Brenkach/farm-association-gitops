# Loki в режимі одного процесу (Monolithic), сховище — локальний диск
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: loki
    targetRevision: 21.2.3
    helm:
      valuesObject:
        deploymentMode: Monolithic
        loki:
          # один tenant, без заголовка X-Scope-OrgID
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          limits_config:
            allow_structured_metadata: true
            volume_enabled: true
        singleBinary:
          replicas: 1
          persistence:
            size: 2Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
        # у режимі одного процесу інші компоненти не потрібні
        backend:
          replicas: 0
        read:
          replicas: 0
        write:
          replicas: 0
        # економимо ресурси minikube
        gateway:
          enabled: false
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        lokiCanary:
          enabled: false
        test:
          enabled: false
        sidecar:
          rules:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
