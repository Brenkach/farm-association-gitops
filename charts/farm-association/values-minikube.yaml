# Значення для кластера minikube (керується Argo CD)
# 4 репліки, щоб при canary було видно співвідношення версій (25/50/75 %)
replicaCount: 4

image:
  repository: ghcr.io/brenkach/farm-association
  tag: "1.3.0"
  pullPolicy: IfNotPresent

# пароль і ключ лежать у Secret farm-secret, створеному в кластері вручну
secret:
  existingSecret: farm-secret

ingress:
  enabled: true
  className: nginx
  host: farm.local

# невдале оновлення стає Degraded через 60 с, а не через 10 хв
progressDeadlineSeconds: 60

# Progressive delivery: canary через Argo Rollouts
rollout:
  enabled: true
  canary:
    maxSurge: 1
    maxUnavailable: 0
    steps:
      - setWeight: 25        # 1 з 4 подів — нова версія
      - pause: {}            # ручна пауза: чекаємо promote
      - setWeight: 50        # 2 з 4
      - pause:
          duration: 30s      # пауза з таймером
      - setWeight: 75        # 3 з 4
      - pause:
          duration: 30s

# Helm-хуки й тести вимикаємо: Argo CD виконує pre-upgrade як PreSync
# ще до створення бази, а helm test не підтримує
hooks:
  preUpgrade:
    enabled: false
tests:
  enabled: false
